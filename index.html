<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unwrapped — write a note</title>
    <link rel="stylesheet" href="surface.css?v=13">
    <link rel="stylesheet" href="write.css?v=13">
</head>
<body>

    <!-- The same desk the note is read on. backdrop.js finds these by id. -->
    <div id="desk"></div>
    <div id="desk-mottle"></div>
    <div id="desk-grain"></div>
    <div id="lamp"></div>
    <div id="vignette"></div>

    <main id="lab">

        <h1 id="title">Write a note</h1>

        <div id="surface">
            <canvas id="paper"></canvas>
            <canvas id="ink"></canvas>
        </div>

        <div id="status">write with your finger</div>

        <div id="controls">
            <button id="btn-undo">Undo</button>
            <button id="btn-clear">Clear</button>
            <button id="btn-replay">Replay</button>
            <button id="btn-link" class="primary">Create link</button>
            <!-- write.js binds this one and would throw if it were missing;
                 it is the raw-data escape hatch, not part of the flow. -->
            <button id="btn-export" hidden>Data</button>
        </div>

        <div id="share" hidden>
            <input id="share-url" readonly spellcheck="false">
            <div id="share-actions">
                <button id="btn-copy" class="primary">Copy link</button>
                <button id="btn-share" hidden>Share</button>
                <a id="share-open" target="_blank" rel="noopener">Open it yourself</a>
            </div>
            <p id="share-note">The whole note travels inside the link. Nothing is stored on a server.</p>
        </div>

    </main>

    <script src="backdrop.js?v=13"></script>
    <script src="write.js?v=13"></script>
    <script src="link.js?v=13"></script>
    <script src="create.js?v=13"></script>
</body>
</html>
