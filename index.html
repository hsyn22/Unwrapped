<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unwrapped ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="sky"></div>
    <div id="glow"></div>
    <div id="rays"></div>
    <div id="stars"></div>

    <main id="experience">

        <div id="paper-container">
            <div id="paper-scene">

                <div class="leaf" id="panel-bl"></div>

                <!-- One slice of the fold-1 flap. script.js clones this into a
                     chain of BEND_STRIPS slices, each hinged to the one below,
                     so the sheet bends instead of swinging as one rigid plane.
                     #fold1 itself no longer rotates; it is just the flap's box
                     and carries the thickness lift. -->
                <div class="hinge hinge-x" id="fold1">
                    <div class="strip">
                        <div class="face face-front slice-tl"></div>
                        <div class="face face-back face-back-x slice-tl-back"></div>
                        <div class="hinge hinge-y slice-tr-hinge">
                            <div class="face face-front slice-tr"></div>
                            <div class="face face-back face-back-y slice-tr-back"></div>
                        </div>
                    </div>
                </div>

                <div class="hinge hinge-y" id="fold2-br">
                    <div class="face face-front" id="panel-br"></div>
                    <div class="face face-back face-back-y"></div>
                </div>

            </div>
        </div>

        <div id="hint">Swipe up to unfold</div>

        <div id="debug-panel" style="display:none">
            <div class="dbg-row">
                <span>Fold 1 —</span>
                <button class="dbg" data-fold="1" data-p="0">0%</button>
                <button class="dbg" data-fold="1" data-p="0.25">25%</button>
                <button class="dbg" data-fold="1" data-p="0.5">50%</button>
                <button class="dbg" data-fold="1" data-p="0.75">75%</button>
                <button class="dbg" data-fold="1" data-p="1">100%</button>
            </div>
            <div class="dbg-row">
                <span>Fold 2 —</span>
                <button class="dbg" data-fold="2" data-p="0">0%</button>
                <button class="dbg" data-fold="2" data-p="0.25">25%</button>
                <button class="dbg" data-fold="2" data-p="0.5">50%</button>
                <button class="dbg" data-fold="2" data-p="0.75">75%</button>
                <button class="dbg" data-fold="2" data-p="1">100%</button>
            </div>
        </div>

    </main>

    <script>
        // The fold-state panel is off in the real experience. Add ?debug=1 to
        // the URL to bring it back for testing exact geometry states.
        // Delete the panel and this script together in Phase 4.
        // Inline display beats the #debug-panel rule in style.css, which an
        // [hidden] attribute would lose to.
        if (/[?&]debug=1(&|$)/.test(location.search)) {
            document.getElementById('debug-panel').style.display = '';
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="script.js"></script>
    <script src="silhouette.js"></script>
    <script src="ink.js"></script>
</body>
</html>
